name: Publish container image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  # Container registry repository names must be lowercase.
  IMAGE_NAME: ghcr.io/tongzhouxu/isoscout

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          REF_TAG="${GITHUB_REF_NAME}"
          echo "ref_tag=${REF_TAG}" >> "$GITHUB_OUTPUT"

      # linux/amd64 only: quast=5.3.0 has no linux/arm64 build compatible
      # with the pinned Python 3.11 (see references/setup.md).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.ref_tag }}
