name: Test and publish container image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request: {}
  workflow_dispatch: {}

env:
  # Container registry repository names must be lowercase.
  IMAGE_NAME: ghcr.io/tongzhouxu/isoscout

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Test the installed wheel outside the checkout
        run: |
          python -m pip install --no-deps dist/*.whl
          python tests/check_installed_cli.py -v

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          load: true
          tags: isoscout:test
          build-args: |
            VCS_REF=${{ github.sha }}

      - name: Run software verification
        run: >-
          docker run --rm --platform linux/amd64
          --entrypoint /usr/local/bin/_entrypoint.sh
          --env ISOSCOUT_TOOL_TESTS=1
          isoscout:test
          python3 -m unittest discover -s /opt/isoscout/tests -v

  build-and-push:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        run: |
          REF_TAG="${GITHUB_REF_NAME}"
          echo "ref_tag=${REF_TAG}" >> "$GITHUB_OUTPUT"

      # linux/amd64 only: quast=5.3.0 has no linux/arm64 build compatible
      # with the pinned Python 3.11 (see references/setup.md).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.ref_tag }}
